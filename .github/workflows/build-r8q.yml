name: Build R8Q Tow-Boot image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Galaxy S20 FE (R8Q) experimental Tow-Boot
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Install packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends device-tree-compiler
      - name: Build R8Q firmware
        run: nix-build -A samsung-galaxyS20FER8q -o result-r8q
      - name: Verify Tow-Boot features
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_r8q_tow_boot.py'
          python3 .github/scripts/check-r8q-tow-boot.py \
            result-r8q/config/noenv.config result-r8q/r8q-build/u-boot.bin
      - name: Extract matching packaging tools and Samsung inputs
        run: |
          archive=$(nix-build -A samsung-galaxyS20FER8q.config.Tow-Boot.src --no-out-link)
          mkdir r8q-source
          tar -xf "$archive" -C r8q-source --strip-components=1
      - name: Test boot image packaging
        run: bash r8q-source/.github/scripts/test-r8q-package.sh
      - name: Assemble and verify Android boot image
        run: |
          bash r8q-source/.github/scripts/r8q-package.sh \
            "$PWD/result-r8q/r8q-build" "$PWD/artifacts/r8q"
          mv artifacts/r8q/u-boot-r8q-boot.img artifacts/r8q/tow-boot-r8q-boot.img
          python3 .github/scripts/check-r8q-tow-boot.py \
            result-r8q/config/noenv.config result-r8q/r8q-build/u-boot.bin \
            --boot-image artifacts/r8q/tow-boot-r8q-boot.img
          cp result-r8q/config/noenv.config artifacts/r8q/build.config
          {
            echo "Experimental Tow-Boot for Samsung Galaxy S20 FE (R8Q/SM8250)"
            echo "Tow-Boot menu and logo on the pinned R8Q hardware-support fork."
            echo "No hardware boot test performed by CI."
            echo "Samsung boot image inputs come from the pinned U-Boot source."
            echo "Verify compatibility with your exact model and firmware before flashing."
            echo "Tow-Boot repository revision: $(git rev-parse HEAD)"
            echo "Flashable image: tow-boot-r8q-boot.img"
            echo "Artifact: tow-boot-r8q-$GITHUB_SHA"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "U-Boot source URL:"
            nix-instantiate --eval --strict --json \
              -A samsung-galaxyS20FER8q.config.Tow-Boot.src.url
          } > artifacts/r8q/BUILD_INFO.txt
          (
            cd artifacts/r8q
            sha256sum u-boot.bin u-boot-control.dtb sm8250-samsung-r8q.dtb \
              tow-boot-r8q-boot.img build.config BUILD_INFO.txt > SHA256SUMS
          )
          {
            echo "### Experimental R8Q image"
            echo "Download artifact: tow-boot-r8q-$GITHUB_SHA"
            echo 'Flashable image: `tow-boot-r8q-boot.img` (not the raw `u-boot.bin`).'
            echo 'Older `r8q-boot-image` artifacts can contain plain U-Boot; do not use them for this build.'
            echo "Includes the Tow-Boot menu and logo while retaining the R8Q EFI boot path."
            echo "Hold Volume Down at startup for the menu; use volume keys and Power to select."
            echo "Packaging is validated; booting on hardware is not."
            echo "The image uses the pinned fork's Samsung DTBs and header."
            echo "Confirm they match your phone firmware and have a recovery path before flashing."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload boot image and matching artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tow-boot-r8q-${{ github.sha }}
          path: artifacts/r8q/
          if-no-files-found: error
          retention-days: 30
